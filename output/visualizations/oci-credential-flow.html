<div id="oci-credential-flow">
  <style>
    #oci-credential-flow { color:var(--foreground); }
    #oci-credential-flow .flow-heading { margin-bottom:calc(var(--font-size-base) * 1); }
    #oci-credential-flow .flow-diagram { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:calc(var(--font-size-base) * .75); margin:calc(var(--font-size-base) * 1.5) 0; }
    #oci-credential-flow .flow-node { min-width:0; display:flex; flex-direction:column; gap:calc(var(--font-size-base) * .5); overflow-wrap:anywhere; }
    #oci-credential-flow .flow-node strong { font-weight:500; }
    #oci-credential-flow .flow-arrow { display:flex; flex-direction:column; align-items:center; gap:calc(var(--font-size-base) * .25); color:var(--muted-foreground); }
    #oci-credential-flow .flow-arrow .flow-verb { max-width:calc(var(--font-size-base) * 5); text-align:center; }
    #oci-credential-flow .flow-result { display:flex; gap:calc(var(--font-size-base) * .75); align-items:baseline; margin-top:calc(var(--font-size-base) * 1); }
    #oci-credential-flow .flow-result-label { color:var(--muted-foreground); }
    @media(max-width:520px) {
      #oci-credential-flow .flow-diagram { grid-template-columns:minmax(0,1fr); }
      #oci-credential-flow .flow-arrow { flex-direction:row; justify-content:flex-start; }
      #oci-credential-flow .flow-arrow .flow-symbol { transform:rotate(90deg); }
      #oci-credential-flow .flow-arrow .flow-verb { max-width:none; }
    }
  </style>
  <h3 class="flow-heading">Credential flow</h3>
  <div class="viz-controls" role="group" aria-label="Credential flow stage">
    <button type="button" class="btn" data-stage="0" aria-pressed="false">1. Set up OCI</button>
    <button type="button" class="btn" data-stage="1" aria-pressed="true">2. Generate JWT</button>
    <button type="button" class="btn" data-stage="2" aria-pressed="false">3. Request S3 keys</button>
    <button type="button" class="btn" data-stage="3" aria-pressed="false">4. Access bucket</button>
  </div>
  <div class="flow-diagram" role="group" aria-label="Selected credential path" aria-live="polite">
    <div class="flow-node"><strong data-name="0">Your laptop</strong><span class="text-small" data-action="0">live_demo_token.py</span><code data-key="0">Your SSH private key</code></div>
    <div class="flow-arrow"><span class="flow-symbol" aria-hidden="true">→</span><span class="flow-verb text-small" data-edge="0">SSH</span></div>
    <div class="flow-node"><strong data-name="1">DemoBastion</strong><span class="text-small" data-action="1">SSH jump host</span><code data-key="1">Forwards the connection</code></div>
    <div class="flow-arrow"><span class="flow-symbol" aria-hidden="true">→</span><span class="flow-verb text-small" data-edge="1">SSH</span></div>
    <div class="flow-node"><strong data-name="2">Private issuer VM</strong><span class="text-small" data-action="2">Signs the JWT with RS256</span><code data-key="2">Issuer’s RSA private key</code></div>
  </div>
  <hr>
  <div class="flow-result" aria-live="polite"><span class="flow-result-label">Result</span><span id="oci-flow-result">Signed JWT returned to your terminal · 1-hour lifetime</span></div>
  <script>
    (()=>{
      const root=document.getElementById('oci-credential-flow');
      const stages=[
        {names:['Your laptop','OCI control plane','Demo resources'],actions:['OCI CLI with your existing configuration','Authenticates provisioning requests','IAM groups, private ADB, Vault and Functions'],keys:['Your OCI API signing key','OCI IAM deployment permissions','Resources used by the live app'],edges:['Signed API calls','Provision'],result:'Live OCI infrastructure and fixed bucket IAM policies'},
        {names:['Your laptop','DemoBastion','Private issuer VM'],actions:['live_demo_token.py','SSH jump host','Signs the JWT with RS256'],keys:['Your SSH private key','Forwards the connection','Issuer’s RSA private key'],edges:['SSH','SSH'],result:'Signed JWT returned to your terminal · 1-hour lifetime'},
        {names:['Your browser','Live Lifecycle API','OCI IAM service user'],actions:['Bearer JWT + requested profile','Checks JWT signature, identity and allowed profile','Creates a Customer Secret Key for that profile'],keys:['JWT identifies the caller','Workload principal authenticates OCI calls','Dedicated sales-read / sales-write user'],edges:['HTTPS','OCI SDK'],result:'S3 access key + secret key returned to your browser'},
        {names:['Your S3 client','OCI Object Storage','lcm-live-v2-sales'],actions:['Signs requests using AWS Signature V4','Enforces the service user’s IAM group policy','sales-read: list/read; sales-write: list/read/write'],keys:['Issued access key + secret key','Fixed bucket + operation permissions','Delete and foreign-bucket access denied'],edges:['Signed S3 request','IAM policy'],result:'Bucket-scoped access · managed deletion, with known propagation delay'}
      ];
      const buttons=Array.from(root.querySelectorAll('[data-stage]'));
      function render(index){
        if(!Number.isInteger(index)||index<0||index>=stages.length)index=1;
        const stage=stages[index];
        for(let n=0;n<3;n++){
          root.querySelector('[data-name="'+n+'"]').textContent=stage.names[n];
          root.querySelector('[data-action="'+n+'"]').textContent=stage.actions[n];
          root.querySelector('[data-key="'+n+'"]').textContent=stage.keys[n];
        }
        for(let n=0;n<2;n++)root.querySelector('[data-edge="'+n+'"]').textContent=stage.edges[n];
        root.querySelector('#oci-flow-result').textContent=stage.result;
        buttons.forEach((button,n)=>button.setAttribute('aria-pressed',String(n===index)));
      }
      function restore(state){render(state?.modelContent?.stage??1)}
      restore(window.openai?.widgetState);
      buttons.forEach(button=>button.addEventListener('click',()=>{
        const stage=Number(button.dataset.stage);render(stage);
        window.openai?.setWidgetState?.({modelContent:{stage},privateContent:null})?.catch(()=>{});
      }));
      window.addEventListener('openai:set_globals',event=>{
        if(event.detail?.globals&&'widgetState' in event.detail.globals)restore(event.detail.globals.widgetState);
      });
    })();
  </script>
</div>
